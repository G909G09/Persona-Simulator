<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERSONA WATCH v39</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<style>
:root{
  --bg:#F3F3F1; --paper:#FCFCFB; --ink:#17171A; --muted:#8B8B87;
  --line:#DADAD6; --wall:#17171A; --soft:#ECECEA;
  --mono:'SF Mono',ui-monospace,'Cascadia Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font-family:inherit; cursor:pointer; background:var(--paper); border:1px solid var(--ink); color:var(--ink); padding:5px 12px; font-size:12.5px; font-weight:600; border-radius:2px}
button:hover{background:var(--soft)}
button.primary{background:var(--ink); color:var(--paper)}
button.primary:hover{background:#333}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
select,input[type=text]{font-family:inherit; font-size:12.5px; padding:5px 7px; border:1px solid var(--line); background:var(--paper); border-radius:2px; color:var(--ink)}
input[type=range]{accent-color:var(--ink); width:100%}

/* ── 상단 툴바 ─────────────────────────── */
#toolbar{
  display:flex; align-items:center; gap:14px; padding:10px 18px;
  border-bottom:2px solid var(--wall); background:var(--paper); flex-wrap:wrap;
}
#toolbar .title{font-weight:800; font-size:15px; letter-spacing:.06em}
#toolbar .title small{font-weight:400; color:var(--muted); letter-spacing:0; margin-left:8px}
#clock{font-family:var(--mono); font-size:12.5px; padding:4px 10px; border:1px solid var(--ink); border-radius:2px; background:var(--paper)}
#toolbar .grow{flex:1}
#speedSel{width:70px}

/* ── 3열 레이아웃 ─────────────────────── */
#layout{flex:1; display:grid; grid-template-columns:270px 1fr 330px; min-height:0}
.col{overflow-y:auto; min-height:0}
#leftCol{border-right:1px solid var(--line); background:var(--paper); padding:14px}
#rightCol{border-left:1px solid var(--line); background:var(--paper); display:flex; flex-direction:column}

h2.sec{font-size:11px; letter-spacing:.14em; color:var(--muted); font-weight:700; margin:18px 0 8px}
h2.sec:first-child{margin-top:0}

/* ── 좌: 캐릭터 패널 ──────────────────── */
#roster{display:flex; flex-direction:column; gap:4px}
.rosterItem{display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--line); border-radius:2px; cursor:pointer; background:var(--paper)}
.rosterItem:hover{border-color:var(--ink)}
.rosterItem.sel{background:var(--ink); color:var(--paper)}
.rosterItem .mini{width:22px; height:22px; border-radius:50%; border:1.5px solid currentColor; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0}
.rosterItem .nm{font-weight:700; font-size:13px}
.rosterItem .at{font-size:11px; opacity:.65; margin-left:auto}
.rosterItem .del{border:none; background:none; color:inherit; opacity:.4; font-size:14px; padding:0 2px}
.rosterItem .del:hover{opacity:1}

#createForm{display:flex; flex-direction:column; gap:8px; border:1px solid var(--line); padding:10px; border-radius:2px}
#createForm .row{display:flex; gap:6px; align-items:center}
#createForm label{font-size:11.5px; color:var(--muted); width:34px; flex-shrink:0}
.axRow{display:grid; grid-template-columns:38px 1fr 30px; align-items:center; gap:6px; font-size:11.5px}
.axRow .val{font-family:var(--mono); text-align:right; color:var(--muted)}
#mixOpts{display:none; flex-direction:column; gap:6px; padding-left:40px}
#mixOpts.show{display:flex}
.btnRow{display:flex; gap:6px; flex-wrap:wrap}
.btnRow button{flex:1; white-space:nowrap}
</style>
</head>
<body>
<div id="test">Size-test placeholder — this file exists only to confirm the write tool accepts a ~100KB payload. It will be deleted before the real PR is opened.</div>
<script>
'use strict';
window.onerror=function(msg,src,line,col){
  var el=document.getElementById('errOverlay');
  var isEn=false; try{ isEn=localStorage.getItem('personaWatchLang')==='en'; }catch(e){}
  if(el){el.style.display='block'; el.textContent=(isEn?'Script error: ':'스크립트 오류: ')+msg+(isEn?' (line ':' (줄 ')+line+':'+col+')'+(isEn?' — please capture this message.':' — 이 메시지를 캡처해 주세요.');}
};
let LANG='ko';
try{ LANG=localStorage.getItem('personaWatchLang')||'ko'; }catch(e){}
document.documentElement.lang=LANG==='en'?'en':'ko';
function saveLang(){ try{ localStorage.setItem('personaWatchLang',LANG); }catch(e){} }
const I18N={ ko:{}, en:{} };
function tr(key){ const d=I18N[LANG]||I18N.ko; if(d&&d[key]!==undefined)return d[key]; return (I18N.ko[key]!==undefined)?I18N.ko[key]:key; }
const LABEL_EN={};
function lbl(cat,key){ if(LANG!=='en'||key==null)return key; const m=LABEL_EN[cat]; return (m&&m[key]!==undefined)?m[key]:key; }
</script>
</body>
</html>
